<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Zindagi Hain Tu</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0c3fc, #d1c4e9);
            color: #49345e;
        }

        .hearts {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -40px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 22px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            to {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 38px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(87, 53, 119, 0.16);
            backdrop-filter: blur(10px);
        }

        .heart-icon {
            font-size: 42px;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.12); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(32px, 7vw, 43px);
            color: #7952a8;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #8c7a9e;
            margin-bottom: 27px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .password-wrap {
            display: flex;
            align-items: center;
            border: 1px solid #e3d7ef;
            border-radius: 12px;
            background: white;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .password-wrap:focus-within {
            border-color: #9a76c5;
            box-shadow: 0 0 0 3px rgba(154, 118, 197, 0.13);
        }

        .password-wrap input {
            width: 100%;
            min-width: 0;
            padding: 14px;
            border: none;
            outline: none;
            background: transparent;
            color: #49345e;
            font: inherit;
            font-size: 14px;
        }

        .toggle-password {
            flex-shrink: 0;
            padding: 10px 12px;
            border: none;
            background: transparent;
            color: #7952a8;
            font-size: 12px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #9b72c9, #7650a8);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(118, 80, 168, 0.25);
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            border-radius: 9px;
            background: #fff0f1;
            color: #bd3546;
            font-size: 12px;
        }

        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: #a393b4;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
                border-radius: 20px;
            }

            .subtitle {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="login-card">
    <div class="heart-icon">💜</div>

    <h1>Meri Zindagi Hain Tu</h1>
    <p class="subtitle">Some memories are meant to stay forever.</p>

    <form action="{{ url_for('login') }}" method="POST" id="loginForm">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <label for="password">Enter Password</label>

        <div class="password-wrap">
            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
            >Show</button>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            Open My Heart ♡
        </button>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}
    </form>

    <div class="footer">Made with love ♡</div>
</main>

<script>
    // Floating hearts
    const heartsContainer = document.getElementById("hearts");
    const heartSymbols = ["♡", "♥", "❤"];

    for (let i = 0; i < 22; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = heartSymbols[
            Math.floor(Math.random() * heartSymbols.length)
        ];

        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDuration = (8 + Math.random() * 10) + "s";
        heart.style.animationDelay = (Math.random() * 10) + "s";
        heart.style.fontSize = (14 + Math.random() * 18) + "px";

        heartsContainer.appendChild(heart);
    }

    // Show / hide password
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
        const show = passwordInput.type === "password";

        passwordInput.type = show ? "text" : "password";
        togglePassword.textContent = show ? "Hide" : "Show";
        togglePassword.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password"
        );
    });
</script>

</body>
</html>
