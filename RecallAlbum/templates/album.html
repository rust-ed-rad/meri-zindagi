<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Zindagi Hain Tu</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>

        /* ============================= */
        /*       BASIC RESET              */
        /* ============================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #d1c4e9 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #444;
        }


        /* ============================= */
        /*       FLOATING HEARTS          */
        /* ============================= */

        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            top: -10%;
            color: rgba(192, 119, 255, 0.4);

            /* Continuous falling */
            animation: fall linear infinite;

            font-size: 20px;
        }

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }

        }


        /* ============================= */
        /*       GALLERY SECTION          */
        /* ============================= */

        #gallery-section {
            padding: 80px 20px 150px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 60px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(142, 68, 173, 0.4);
        }


        /* ============================= */
        /*       ZIGZAG LAYOUT            */
        /* ============================= */

        .gallery-container {
            width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .photo-card {
            background: white;
            padding: 15px 15px 50px 15px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 280px;
            opacity: 0;

            transition:
                transform 0.8s ease,
                opacity 0.8s ease,
                box-shadow 0.3s;

            cursor: pointer;
        }


        /* Right side */
        .photo-card:nth-child(odd) {
            align-self: flex-end;
            transform:
                translateX(50px)
                rotate(5deg)
                translateY(50px);

            margin-bottom: 30px;
        }


        /* Left side */
        .photo-card:nth-child(even) {
            align-self: flex-start;
            transform:
                translateX(-50px)
                rotate(-5deg)
                translateY(50px);

            margin-top: -120px;
            margin-bottom: 30px;
        }


        /* Animation state */

        .photo-card.visible {
            opacity: 1;
            transform:
                translateX(0)
                rotate(0deg)
                translateY(0);
        }

        .photo-card:nth-child(odd).visible {
            transform: rotate(4deg);
        }

        .photo-card:nth-child(even).visible {
            transform: rotate(-4deg);
        }


        .photo-card:hover {
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 10;
        }


        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }


        .photo-caption {
            margin-top: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: #555;
        }


        /* ============================= */
        /*          LIGHTBOX              */
        /* ============================= */

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.9);

            justify-content: center;
            align-items: center;

            z-index: 100;

            cursor: pointer;

            padding: 20px;
        }


        /*
           IMPORTANT:
           The original already-loaded image is moved
           into the lightbox.

           Therefore browser does NOT need to request
           the image again.
        */

        #lightbox .lightbox-active-image {
            width: auto;
            height: auto;

            max-width: 90vw;
            max-height: 90vh;

            object-fit: contain;

            border: 10px solid white;

            box-shadow:
                0 0 30px rgba(255,255,255,0.2);

            border-radius: 2px;
        }


        /* ============================= */
        /*        AUDIO & LOGOUT          */
        /* ============================= */

        #music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;

            width: 50px;
            height: 50px;

            border-radius: 50%;

            background: #8e44ad;
            color: white;

            border: none;

            font-size: 20px;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.2);

            z-index: 99;
        }


        #logout-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;

            padding: 10px 20px;

            border-radius: 20px;

            background: #e74c3c;
            color: white;

            border: none;

            font-size: 14px;

            cursor: pointer;

            z-index: 99;

            text-decoration: none;

            font-family: 'Poppins', sans-serif;
        }


        /* ============================= */
        /*          PHONE LAYOUT          */
        /* ============================= */

        @media (max-width: 600px) {

            #gallery-section {
                padding: 45px 8px 120px 8px;
            }

            h1 {
                font-size: 2.4rem;
                margin-bottom: 35px;
                line-height: 1.2;
            }

            .gallery-container {
                width: 100%;
                max-width: 100%;
                margin: 0 auto;
                position: relative;
            }

            .photo-card {
                width: clamp(145px, 43vw, 190px);
                padding: 8px 8px 28px 8px;
                border-radius: 3px;
            }

            .photo-card img {
                width: 100%;
                height: auto;
                display: block;
            }

            .photo-caption {
                margin-top: 12px;
                font-size: 1.05rem;
                line-height: 1.2;
            }


            /* Right */

            .photo-card:nth-child(odd) {
                align-self: flex-end;

                margin-right: 5vw;
                margin-top: 0;
                margin-bottom: -45px;

                transform:
                    translateX(35px)
                    rotate(4deg)
                    translateY(30px);
            }


            /* Left */

            .photo-card:nth-child(even) {
                align-self: flex-start;

                margin-left: 5vw;
                margin-top: 0;
                margin-bottom: 10px;

                transform:
                    translateX(-35px)
                    rotate(-4deg)
                    translateY(30px);
            }


            .photo-card.visible {
                opacity: 1;
            }

            .photo-card:nth-child(odd).visible {
                transform: rotate(4deg);
            }

            .photo-card:nth-child(even).visible {
                transform: rotate(-4deg);
            }


            /* Lightbox */

            #lightbox {
                padding: 10px;
            }

            #lightbox .lightbox-active-image {
                max-width: 92vw;
                max-height: 82vh;
                border-width: 6px;
            }


            /* Buttons */

            #music-btn {
                width: 44px;
                height: 44px;

                right: 10px;
                bottom: 10px;

                font-size: 17px;
            }

            #logout-btn {
                left: 10px;
                bottom: 10px;

                padding: 7px 15px;

                font-size: 11px;
            }
        }


        /* ============================= */
        /*       VERY SMALL PHONES        */
        /* ============================= */

        @media (max-width: 380px) {

            h1 {
                font-size: 2.15rem;
            }

            .photo-card {
                width: 42vw;
                max-width: 165px;
            }

            .photo-caption {
                font-size: 0.95rem;
            }

            .photo-card:nth-child(odd) {
                margin-right: 4vw;
            }

            .photo-card:nth-child(even) {
                margin-left: 4vw;
            }
        }


        /* ============================= */
        /*       MEMORY TRANSITION        */
        /* ============================= */

        #image-loading-screen {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    #e0c3fc 0%,
                    #d1c4e9 100%
                );

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 9999;

            opacity: 1;

            transition:
                opacity 1.8s ease;
        }


        .memory-message {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #8e44ad;
            text-align: center;
            width: 90%;
            max-width: 700px;
            line-height: 1.7;
            white-space: pre-line;
        }
        
        @media (max-width: 600px) {
            .memory-message {
                font-size: 1.6rem;
                line-height: 1.5;
                width: 90%;
            }
        }

        .memory-message::after {
            content: "|";

            animation:
                blink-cursor 0.8s infinite;
        }


        @keyframes blink-cursor {

            0%, 50% {
                opacity: 1;
            }

            51%, 100% {
                opacity: 0;
            }

        }


        /* ============================= */
        /*      TRANSITION HEARTS         */
        /* ============================= */

        .transition-hearts {
            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }


        .transition-heart {
            position: absolute;

            top: -50px;

            font-size: 20px;

            color: rgba(192, 119, 255, 0.4);

            /*
               IMPORTANT:
               Infinite means hearts keep falling
               continuously instead of stopping
               after one batch.
            */
            animation:
                fall-heart linear infinite;

            opacity: 0.8;
        }


        @keyframes fall-heart {

            0% {
                transform:
                    translateY(-50px)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }

    </style>
</head>


<body>


    <!-- ============================= -->
    <!--       TRANSITION SCREEN        -->
    <!-- ============================= -->

    <div id="image-loading-screen">

        <div
            class="transition-hearts"
            id="transition-hearts">
        </div>

        <div
            class="memory-message"
            id="memory-message">
        </div>

    </div>


    <!-- ============================= -->
    <!--       BACKGROUND HEARTS        -->
    <!-- ============================= -->

    <div
        class="bg-hearts"
        id="hearts-container">
    </div>


    <!-- ============================= -->
    <!--          GALLERY               -->
    <!-- ============================= -->

    <section id="gallery-section">

        <h1>{{ heading }}</h1>


        <div
            class="gallery-container"
            id="gallery-grid">

            {% for photo in photos %}

            <div
                class="photo-card"
                data-img="{{ url_for('private_image', photo_id=photo.id) }}">

                <img
                    src="{{ url_for('private_image', photo_id=photo.id) }}"
                    alt="Memory">

                <div class="photo-caption">
                    {{ photo.caption }}
                </div>

            </div>

            {% endfor %}

        </div>

    </section>


    <!-- ============================= -->
    <!--          LIGHTBOX              -->
    <!-- ============================= -->

    <div
        id="lightbox"
        onclick="closeLightbox()">

        <div id="lightbox-container"></div>

    </div>


    <!-- ============================= -->
    <!--            AUDIO              -->
    <!-- ============================= -->

    <audio
        id="bgMusic"
        autoplay
        loop>

        <source
            src="{{ url_for('static', filename='oursong.mp3') }}"
            type="audio/mpeg">

    </audio>


    <!-- ============================= -->
    <!--           BUTTONS              -->
    <!-- ============================= -->

    <button
        id="music-btn"
        onclick="toggleMusic()">
        🎵
    </button>


    <a
        href="/logout"
        id="logout-btn">
        Logout
    </a>


    <!-- ============================= -->
    <!--          JAVASCRIPT            -->
    <!-- ============================= -->

    <script>


        /* ================================= */
        /*      ALWAYS START FROM TOP        */
        /* ================================= */

        window.scrollTo(0, 0);


        const loadingScreen =
            document.getElementById(
                'image-loading-screen'
            );


        loadingScreen.style.display = 'flex';
        loadingScreen.style.opacity = '1';


        /* ================================= */
        /*          1. HEARTS                */
        /* ================================= */

        function createHearts() {

            const container =
                document.getElementById(
                    'hearts-container'
                );


            for (let i = 0; i < 25; i++) {

                const heart =
                    document.createElement('div');


                heart.innerHTML = '❤';

                heart.className = 'heart';


                heart.style.left =
                    Math.random() * 100 + 'vw';


                heart.style.animationDuration =
                    Math.random() * 4 + 3 + 's';


                heart.style.animationDelay =
                    Math.random() * 4 + 's';


                heart.style.fontSize =
                    Math.random() * 20 + 15 + 'px';


                container.appendChild(heart);

            }

        }


        createHearts();


        /* ================================= */
        /*       2. TRANSITION HEARTS        */
        /* ================================= */

        const transitionHearts =
            document.getElementById(
                'transition-hearts'
            );


        for (let i = 0; i < 25; i++) {

            const heart =
                document.createElement('div');


            heart.className =
                'transition-heart';


            heart.innerHTML = '❤';


            heart.style.left =
                Math.random() * 100 + '%';


            /*
               Infinite animation.
               Every heart keeps repeating.
            */

            heart.style.animationDuration =
                (4 + Math.random() * 5) + 's';


            heart.style.animationDelay =
                -(Math.random() * 8) + 's';


            heart.style.fontSize =
                (12 + Math.random() * 14) + 'px';


            transitionHearts.appendChild(heart);

        }


        /* ================================= */
        /*             3. MUSIC              */
        /* ================================= */

        const music =
            document.getElementById(
                'bgMusic'
            );


        let isPlaying = false;


        function playMusic() {

            if (!music) {
                return;
            }


            music.play()
                .then(() => {

                    isPlaying = true;


                    document.getElementById(
                        'music-btn'
                    ).innerText = "🔊";

                })
                .catch(() => {

                    /*
                       Browser autoplay policy may
                       block autoplay.

                       No error is thrown to the user.
                    */

                    isPlaying = false;

                });

        }


        function toggleMusic() {

            if (!music) {
                return;
            }


            if (isPlaying) {

                music.pause();


                document.getElementById(
                    'music-btn'
                ).innerText = "🔇";


                isPlaying = false;

            }

            else {

                music.play()
                    .then(() => {

                        isPlaying = true;


                        document.getElementById(
                            'music-btn'
                        ).innerText = "🔊";

                    })
                    .catch(() => {

                        isPlaying = false;

                    });

            }

        }


        /* ================================= */
        /*       4. MEMORY MESSAGE           */
        /* ================================= */

        function startMemoryMessage() {

            const messageElement =
                document.getElementById(
                    'memory-message'
                );


            /*
               Start music at the same time
               as the typing animation.
            */

            playMusic();


            const messageText =
            `This little gift is just for you. 
            Because someone as special as you
            deserves something special too.
            
            Happy Birthday, Meri Zindagi💌`;

            let index = 0;


            messageElement.textContent = "";


            function typeMessage() {

                if (index < messageText.length) {

                    messageElement.textContent +=
                        messageText.charAt(index);


                    index++;


                    setTimeout(
                        typeMessage,
                        70
                    );

                }

                else {

                    /*
                       Message finished.
                       Wait 4 seconds.
                    */

                    setTimeout(() => {

                        /*
                           VERY IMPORTANT:
                           Force the document to the exact
                           top BEFORE hiding the transition.
                        */

                        window.scrollTo({
                            top: 0,
                            left: 0,
                            behavior: 'auto'
                        });


                        /*
                           Fade transition screen.
                        */

                        loadingScreen.style.opacity =
                            "0";


                        /*
                           Wait until fade is completely
                           finished.
                        */

                        setTimeout(() => {

                            /*
                               Keep exact top position
                               immediately before gallery
                               becomes visible.
                            */

                            window.scrollTo({
                                top: 0,
                                left: 0,
                                behavior: 'auto'
                            });


                            loadingScreen.style.display =
                                "none";


                            /*
                               Start auto-scroll ONLY AFTER
                               transition screen disappears.

                               This prevents the gallery from
                               moving underneath the transition.
                            */

                            startAutoScroll();

                        }, 1800);


                    }, 4000);

                }

            }


            typeMessage();

        }


        /* ================================= */
        /*       5. GALLERY ANIMATION        */
        /* ================================= */

        const cards =
            document.querySelectorAll(
                '.photo-card'
            );


        cards.forEach(card => {

            card.classList.add('visible');


            card.addEventListener(
                'click',
                function(event) {

                    /*
                       Use the EXISTING loaded image
                       instead of creating another
                       network request.
                    */

                    const originalImage =
                        this.querySelector('img');


                    openLightbox(
                        originalImage
                    );

                }
            );

        });


        /* ================================= */
        /*            6. LIGHTBOX            */
        /* ================================= */

        let activeImage = null;

        let originalParent = null;

        let originalNextSibling = null;


        function openLightbox(imageElement) {

            if (!imageElement) {
                return;
            }


            const lightbox =
                document.getElementById(
                    'lightbox'
                );


            const container =
                document.getElementById(
                    'lightbox-container'
                );


            /*
               Remember where the original image
               belongs.
            */

            activeImage = imageElement;

            originalParent =
                imageElement.parentNode;

            originalNextSibling =
                imageElement.nextSibling;


            /*
               Remove any previous content.
            */

            container.innerHTML = "";


            /*
               Add special lightbox class.
            */

            imageElement.classList.add(
                'lightbox-active-image'
            );


            /*
               MOVE the already-loaded image
               into the lightbox.

               No new image URL is assigned.
               No second database request.
               No second private_image request.
            */

            container.appendChild(
                imageElement
            );


            lightbox.style.display =
                'flex';

        }


        function closeLightbox() {

            const lightbox =
                document.getElementById(
                    'lightbox'
                );


            if (
                activeImage &&
                originalParent
            ) {

                /*
                   Restore original image
                   exactly where it was.
                */

                activeImage.classList.remove(
                    'lightbox-active-image'
                );


                if (
                    originalNextSibling &&
                    originalNextSibling.parentNode ===
                    originalParent
                ) {

                    originalParent.insertBefore(
                        activeImage,
                        originalNextSibling
                    );

                }

                else {

                    originalParent.appendChild(
                        activeImage
                    );

                }

            }


            lightbox.style.display =
                'none';


            activeImage = null;

            originalParent = null;

            originalNextSibling = null;

        }


        /* ================================= */
        /*          7. AUTO SCROLL           */
        /* ================================= */
        
        let isRewinding = false;
        let autoScrollStarted = false;
        let isManuallyScrolling = false;
        let isPointerOverPage = false;
        
        // Phone-এর current speed
        // PC/Laptop-এর জন্য আলাদা speed
        const isPhone = window.innerWidth <= 600;
        
        const scrollSpeed = isPhone ? 0.35 : 0.45;
        
        
        // =========================================
        //        MANUAL SCROLL DETECTION
        // =========================================
        
        let manualScrollTimer = null;
        
        window.addEventListener('wheel', () => {
        
            if (!isPhone) {
                isManuallyScrolling = true;
        
                clearTimeout(manualScrollTimer);
        
                manualScrollTimer = setTimeout(() => {
                    isManuallyScrolling = false;
                }, 800);
            }
        
        }, { passive: true });
        
        
        /*
           Phone-এর touch scroll manually detect করা হবে।
           Auto-scroll touch করার কারণে বন্ধ হবে না permanently.
        */
        
        if (isPhone) {
        
            let touchTimer = null;
        
            window.addEventListener('touchstart', () => {
        
                isManuallyScrolling = true;
        
                clearTimeout(touchTimer);
        
            }, { passive: true });
        
        
            window.addEventListener('touchend', () => {
        
                clearTimeout(touchTimer);
        
                touchTimer = setTimeout(() => {
                    isManuallyScrolling = false;
                }, 500);
        
            }, { passive: true });
        
        }
        
        
        // =========================================
        //        PC POINTER PAUSE
        // =========================================
        
        if (!isPhone) {
        
            document.addEventListener('mouseenter', () => {
        
                isPointerOverPage = true;
        
            });
        
        
            document.addEventListener('mouseleave', () => {
        
                isPointerOverPage = false;
        
            });
        
        }
        
        
        // =========================================
        //             AUTO SCROLL
        // =========================================
        
        function startAutoScroll() {
        
            if (autoScrollStarted) {
                return;
            }
        
            autoScrollStarted = true;
        
        
            let lastTime = performance.now();
        
            let scrollPosition = window.scrollY;
        
        
            function loop(currentTime) {
        
                const deltaTime =
                    Math.min(
                        currentTime - lastTime,
                        50
                    );
        
                lastTime = currentTime;
        
        
                /*
                   Always sync our internal position
                   with the user's actual position.
        
                   This is what allows manual scrolling.
                */
        
                if (
                    Math.abs(
                        window.scrollY - scrollPosition
                    ) > 2
                ) {
        
                    scrollPosition =
                        window.scrollY;
        
                }
        
        
                // =====================================
                //             FORWARD SCROLL
                // =====================================
        
                if (!isRewinding) {
        
                    /*
                       PC:
                       Pointer page-এর উপর থাকলে pause.
        
                       Phone:
                       Pointer condition নেই.
                    */
        
                    const shouldPause =
                        (!isPhone && isPointerOverPage) ||
                        isManuallyScrolling;
        
        
                    if (!shouldPause) {
        
                        scrollPosition +=
                            scrollSpeed *
                            (deltaTime / 16.67);
        
        
                        window.scrollTo(
                            0,
                            scrollPosition
                        );
        
                    }
        
        
                    const atBottom =
                        (
                            window.innerHeight +
                            window.scrollY
                        ) >=
                        (
                            document.documentElement
                                .scrollHeight - 10
                        );
        
        
                    if (atBottom) {
        
                        isRewinding = true;
        
                        scrollPosition =
                            window.scrollY;
        
                    }
        
                }
        
        
                // =====================================
                //             REWIND TO TOP
                // =====================================
        
                else {
        
                    /*
                       Rewind only when user is not
                       manually scrolling.
                    */
        
                    if (!isManuallyScrolling) {
        
                        scrollPosition -=
                            3.5 *
                            (deltaTime / 16.67);
        
        
                        if (scrollPosition <= 0) {
        
                            scrollPosition = 0;
        
        
                            window.scrollTo(
                                0,
                                0
                            );
        
        
                            isRewinding = false;
        
                        }
        
                        else {
        
                            window.scrollTo(
                                0,
                                scrollPosition
                            );
        
                        }
        
                    }
        
                }
        
        
                requestAnimationFrame(loop);
        
            }
        
        
            requestAnimationFrame(loop);
        
        }


        /* ================================= */
        /*             8. START              */
        /* ================================= */

        /*
           DO NOT wait for window 'load'.

           Images can load in the background while
           the transition message is typing.

           Function declarations are hoisted,
           so startMemoryMessage() is safe here.
